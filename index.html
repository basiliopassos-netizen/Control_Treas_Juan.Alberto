<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control — J.A.</title>
    <!-- Librería para la generación de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 40px;
        }

        /* Cabecera Principal */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--accent);
            color: #0f172a;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 800;
        }

        .btn-menu {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.3rem;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Menú Lateral Desplegable (Drawer) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 99;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100vh;
            background: var(--card-bg);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: right 0.3s ease;
            z-index: 100;
            border-left: 1px solid var(--border);
        }

        .drawer.open {
            right: 0;
        }

        .drawer h3 {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout de tarjetas */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .form-vertical {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px 12px;
        }

        .input-icon {
            font-size: 1.1rem;
            opacity: 0.8;
            min-width: 24px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.95rem;
            color-scheme: dark;
            outline: none;
        }

        .btn-mic {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .btn-mic.listening {
            color: #f59e0b;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Grupo de horas en paralelo con iconos */
        .time-split {
            display: flex;
            gap: 8px;
        }

        .time-split .input-row {
            flex: 1;
        }

        /* Botones verticales */
        .btn-v {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-v:active {
            transform: scale(0.98);
        }

        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-whatsapp { background: var(--success); color: #fff; }
        .btn-pdf { background: #e11d48; color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }

        /* Lista de Tareas */
        .task-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .task-card:last-child {
            border-bottom: none;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .task-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-del {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px;
        }

        .total-box {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
            text-align: right;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Plantilla oculta para el PDF */
        #pdf-template {
            display: none;
            font-family: Arial, sans-serif;
            color: #000;
            padding: 24px;
            background: #fff;
        }

        #pdf-template .header {
            border-bottom: 2px solid #0284c7;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        #pdf-template table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        #pdf-template th, #pdf-template td {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px;
            text-align: left;
            font-size: 12px;
        }

        #pdf-template th { background: #f1f5f9; }
    </style>
</head>
<body>

    <!-- Cabecera de la App -->
    <header>
        <h1>📋 Tareas <span class="badge">J.A.</span></h1>
        <button class="btn-menu" onclick="toggleDrawer()">☰</button>
    </header>

    <!-- Menú Desplegable Lateral (Drawer) -->
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <h3>Informes y Acciones</h3>
        <button class="btn-v btn-whatsapp" onclick="sendWhatsApp(); toggleDrawer();">📲 WhatsApp</button>
        <button class="btn-v btn-pdf" onclick="generatePDF(); toggleDrawer();">📄 Exportar PDF</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn-v btn-danger" onclick="resetTasks(); toggleDrawer();">🗑️ Borrar Todo</button>
    </div>

    <!-- Formulario Entrada con Iconos -->
    <div class="card">
        <form class="form-vertical" onsubmit="event.preventDefault(); addTask();">
            
            <!-- Fecha -->
            <div class="input-row">
                <span class="input-icon">📅</span>
                <input type="date" id="taskDate">
            </div>

            <!-- Tarea + Micrófono -->
            <div class="input-row">
                <span class="input-icon">📝</span>
                <input type="text" id="taskName" placeholder="Descripción de la tarea...">
                <button type="button" class="btn-mic" id="micBtn" onclick="startVoiceRecognition()" title="Dictar por voz">🎤</button>
            </div>

            <!-- Horas Desde / Hasta -->
            <div class="time-split">
                <div class="input-row" title="Hora Inicio">
                    <span class="input-icon">⏱️</span>
                    <input type="time" id="startTime">
                </div>
                <div class="input-row" title="Hora Fin">
                    <span class="input-icon">🏁</span>
                    <input type="time" id="endTime">
                </div>
            </div>

            <button type="submit" class="btn-v btn-primary">➕ Guardar Registro</button>
        </form>
    </div>

    <!-- Lista de Tareas -->
    <div class="card">
        <div id="taskList"></div>
        <div class="total-box">
            <span>⏱️ Total:</span>
            <span id="totalTime">0 min</span>
        </div>
    </div>

    <!-- Plantilla PDF Oculta -->
    <div id="pdf-template">
        <div class="header">
            <div>
                <h2 style="color: #0284c7; margin:0;">INFORME DE TAREAS Y HORARIOS</h2>
                <div style="font-size: 12px; color: #64748b;">Responsable: J.A.</div>
            </div>
            <div style="text-align: right; font-size: 12px;" id="pdf-date"></div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tarea / Acción</th>
                    <th>Horario</th>
                    <th>Duración</th>
                </tr>
            </thead>
            <tbody id="pdf-table-body"></tbody>
        </table>
        <div style="margin-top: 20px; text-align: right; font-weight: bold; font-size: 13px; color: #0284c7;" id="pdf-total-time"></div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('dailyTasksJA')) || [];

        document.getElementById('taskDate').valueAsDate = new Date();

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function calculateMinutes(start, end) {
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            let st = sh * 60 + sm;
            let et = eh * 60 + em;
            if (et < st) et += 24 * 60;
            return et - st;
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            let total = 0;

            if (tasks.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); font-size: 0.85rem; padding: 8px 0;">Sin registros aún.</p>';
            }

            tasks.sort((a, b) => new Date(a.date + 'T' + a.start) - new Date(b.date + 'T' + b.start));

            tasks.forEach((task, index) => {
                const dur = calculateMinutes(task.start, task.end);
                total += dur;
                const fDate = new Date(task.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

                listEl.innerHTML += `
                    <div class="task-card">
                        <div class="task-meta">
                            <span class="task-title">${task.name}</span>
                            <span class="task-sub">
                                <span>📅 ${fDate}</span> | 
                                <span>⏱️ ${task.start} - ${task.end}</span> 
                                <strong>(${dur}m)</strong>
                            </span>
                        </div>
                        <button class="btn-del" onclick="deleteTask(${index})">🗑️</button>
                    </div>
                `;
            });

            document.getElementById('totalTime').innerText = `${total} min (${(total/60).toFixed(1)} h)`;
            localStorage.setItem('dailyTasksJA', JSON.stringify(tasks));
        }

        function addTask() {
            const date = document.getElementById('taskDate').value;
            const name = document.getElementById('taskName').value.trim();
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!date || !name || !start || !end) {
                alert('Por favor rellena fecha, tarea y horarios.');
                return;
            }

            tasks.push({ date, name, start, end });
            document.getElementById('taskName').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function resetTasks() {
            if (tasks.length === 0) return;
            if (confirm('⚠️ ¿Borrar todas las tareas registradas?')) {
                tasks = [];
                renderTasks();
            }
        }

        function generateTextReport() {
            let r = `📊 *CONTROL DE TAREAS — J.A.*\n-----------------------------------\n`;
            let total = 0;
            tasks.forEach((t, i) => {
                const dur = calculateMinutes(t.start, t.end);
                total += dur;
                const fDate = new Date(t.date + 'T00:00:00').toLocaleDateString('es-ES');
                r += `${i + 1}. [${fDate}] ${t.name}\n   ⏰ ${t.start} - ${t.end} (*${dur} min*)\n`;
            });
            r += `-----------------------------------\n⏱️ *Tiempo Total:* ${total} min (${(total/60).toFixed(1)} h)`;
            return r;
        }

        function sendWhatsApp() {
            if (tasks.length === 0) return alert('No hay registros.');
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(generateTextReport())}`, '_blank');
        }

        function generatePDF() {
            if (tasks.length === 0) return alert('No hay registros.');

            const tbody = document.getElementById('pdf-table-body');
            tbody.innerHTML = '';
            let total = 0;

            tasks.forEach(t => {
                const dur = calculateMinutes(t.start, t.end);
                total += dur;
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(t.date + 'T00:00:00').toLocaleDateString('es-ES')}</td>
                        <td><strong>${t.name}</strong></td>
                        <td>${t.start} - ${t.end}</td>
                        <td>${dur} min</td>
                    </tr>
                `;
            });

            document.getElementById('pdf-date').innerText = `Emisión: ${new Date().toLocaleDateString('es-ES')}`;
            document.getElementById('pdf-total-time').innerText = `Tiempo Total Acumulado: ${total} min (${(total/60).toFixed(1)} h)`;

            const element = document.getElementById('pdf-template');
            element.style.display = 'block';

            html2pdf().set({
                margin: 10,
                filename: `Informe_Tareas_JA_${new Date().toISOString().split('T')[0]}.pdf`,
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                element.style.display = 'none';
            });
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert('Navegador no compatible con dictado.');

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            const micBtn = document.getElementById('micBtn');

            recognition.onstart = () => micBtn.classList.add('listening');
            recognition.onresult = (e) => {
                document.getElementById('taskName').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
            };
            recognition.onerror = recognition.onend = () => micBtn.classList.remove('listening');
            recognition.start();
        }

        renderTasks();
    </script>
</body>
</html>
