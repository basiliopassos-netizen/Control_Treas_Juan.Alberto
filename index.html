<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Tareas - Versión V2</title>

    <!-- Librería externa para generación de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #0d47a1;
            --bg: #e0e5ec;
            --text: #2d3748;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
        }

        /* Fijamos la altura total para permitir scroll interno */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita el scroll global de la pantalla */
        }

        h1 {
            text-align: center;
            font-size: 18px;
            color: var(--primary);
            text-transform: uppercase;
            margin: 5px 0 10px 0;
        }

        /* Estilo 3D Neumórfico para tarjetas */
        .card-3d {
            background: var(--bg);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 5px 5px 10px var(--shadow-dark), 
                        -5px -5px 10px var(--shadow-light);
        }

        label {
            font-weight: bold;
            font-size: 11px;
            display: block;
            margin-top: 2px;
            color: #4a5568;
            text-transform: uppercase;
        }

        input[type="date"], input[type="text"], input[type="time"] {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
            font-size: 15px;
            font-weight: bold;
            color: var(--text);
            box-sizing: border-box;
            text-align: center;
        }

        .time-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-3d {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: var(--primary);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-3d:active {
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3);
        }

        .btn-mic { background: #c62828; }
        .btn-pdf { background: #2e7d32; }
        .btn-ws  { background: #25d366; }

        /* SECCIÓN FIJA Y SECCIÓN DESPLAZABLE */
        .fixed-header {
            flex-shrink: 0; /* No se encoge, se queda bloqueada arriba */
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto; /* Permite el scroll solo de las tareas */
            padding-right: 2px;
            margin-bottom: 5px;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #cbd5e0;
            font-size: 13px;
        }

        .total-box {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- CABECERA BLOQUEADA (NO HACE SCROLL) -->
    <div class="fixed-header">
        <h1>📋 Control de Tareas</h1>

        <!-- Fecha -->
        <div class="card-3d">
            <label for="fecha">Fecha de Registro</label>
            <input type="date" id="fecha">
        </div>

        <!-- Dictado por Voz -->
        <div class="card-3d">
            <label for="tarea">Descripción de la Tarea</label>
            <input type="text" id="tarea" placeholder="Escribe o dicta la tarea...">
            <button type="button" class="btn-3d btn-mic" onclick="dictarVoz()">
                🎤 Dictar por Voz
            </button>
        </div>

        <!-- Relojes de Control Horario -->
        <div class="card-3d">
            <label>Control Horario</label>
            <div class="time-container">
                <div>
                    <label style="font-size: 9px;">Inicio</label>
                    <input type="time" id="h-inicio" value="08:00">
                </div>
                <div>
                    <label style="font-size: 9px;">Fin</label>
                    <input type="time" id="h-fin" value="09:00">
                </div>
            </div>
            <button type="button" class="btn-3d" onclick="agregarTarea()">
                ➕ Añadir Tarea
            </button>
        </div>
    </div>

    <!-- ÁREA DE LISTA CON SCROLL INDEPENDIENTE -->
    <div class="scrollable-content">
        <div class="card-3d">
            <label>Tareas Registradas</label>
            <div id="lista-tareas"></div>
            <div class="total-box" id="sumatorio-total">Total: 0h 0m</div>
        </div>
    </div>

    <!-- BOTONES DE ACCIÓN FIJOS ABAJO -->
    <div class="fixed-header">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button type="button" class="btn-3d btn-pdf" onclick="generarPDF()">
                📄 Guardar PDF
            </button>
            <button type="button" class="btn-3d btn-ws" onclick="enviarWhatsApp()">
                💬 Enviar PDF/WS
            </button>
        </div>
    </div>

    <script>
        let tareas = [];

        window.onload = () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').value = hoy;
        };

        function dictarVoz() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("El navegador no soporta reconocimiento de voz directo.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                document.getElementById('tarea').value = texto.toUpperCase();
            };
        }

        function agregarTarea() {
            const desc = document.getElementById('tarea').value.trim();
            const hIni = document.getElementById('h-inicio').value;
            const hFin = document.getElementById('h-fin').value;

            if (!desc) {
                alert("Escribe o dicta una tarea primero.");
                return;
            }

            const [h1, m1] = hIni.split(':').map(Number);
            const [h2, m2] = hFin.split(':').map(Number);
            let minInicio = h1 * 60 + m1;
            let minFin = h2 * 60 + m2;

            if (minFin <= minInicio) {
                alert("La hora de fin debe ser posterior a la de inicio.");
                return;
            }

            const duracionMin = minFin - minInicio;

            tareas.push({
                descripcion: desc.toUpperCase(),
                inicio: hIni,
                fin: hFin,
                minutos: duracionMin
            });

            document.getElementById('tarea').value = '';
            actualizarLista();
        }

        function actualizarLista() {
            const contenedor = document.getElementById('lista-tareas');
            contenedor.innerHTML = '';
            let totalMinutos = 0;

            tareas.forEach((t, index) => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const tiempoTexto = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                contenedor.innerHTML += `
                    <div class="task-item">
                        <div style="flex: 1; padding-right: 5px;">
                            <strong>${t.descripcion}</strong><br>
                            <small style="color:#718096;">${t.inicio} - ${t.fin}</small>
                        </div>
                        <div style="text-align: right; min-width: 70px;">
                            <span style="font-weight:bold; color:var(--primary);">${tiempoTexto}</span>
                            <button onclick="eliminarTarea(${index})" style="border:none; background:none; color:red; margin-left:5px; cursor:pointer;">❌</button>
                        </div>
                    </div>
                `;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            document.getElementById('sumatorio-total').innerText = `Total Horas: ${totalHrs}h ${totalMins}m`;
        }

        function eliminarTarea(index) {
            tareas.splice(index, 1);
            actualizarLista();
        }

        /* GENERACIÓN DE PDF SIN CORTE DE TEXTO */
        function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const fecha = document.getElementById('fecha').value;

            doc.setFontSize(16);
            doc.text("INFORME DE REGISTRO DE TAREAS", 20, 20);
            doc.setFontSize(11);
            doc.text(`Fecha de Registro: ${fecha}`, 20, 28);

            let y = 40;
            doc.setFont(undefined, 'bold');
            doc.text("Descripción de Tarea", 20, y);
            doc.text("Horario", 130, y);
            doc.text("Duración", 165, y);
            doc.line(20, y + 2, 190, y + 2);

            y += 10;
            doc.setFont(undefined, 'normal');
            let totalMinutos = 0;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                /* AJUSTE CLAVE: Divide el texto para que no se corte en el PDF */
                const lineasTexto = doc.splitTextToSize(t.descripcion, 100);
                
                doc.text(lineasTexto, 20, y);
                doc.text(`${t.inicio} - ${t.fin}`, 130, y);
                doc.text(durStr, 165, y);

                // Incrementar 'y' dinámicamente según la cantidad de líneas generadas por la tarea
                y += (lineasTexto.length * 6) + 4;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            doc.line(20, y + 2, 190, y + 2);
            y += 10;
            doc.setFont(undefined, 'bold');
            doc.setFontSize(13);
            doc.text(`SUMATORIO TOTAL: ${totalHrs}h ${totalMins}m`, 20, y);

            doc.save(`Registro_Tareas_${fecha}.pdf`);
        }

        /* ENVÍO MEJORADO POR WHATSAPP */
        function enviarWhatsApp() {
            if (tareas.length === 0) {
                alert("Agrega al menos una tarea antes de enviar.");
                return;
            }

            // 1. Primero generamos el PDF automáticamente para que quede guardado en el móvil
            generarPDF();

            // 2. Preparamos el resumen en texto completo para WhatsApp
            const fecha = document.getElementById('fecha').value;
            let totalMinutos = 0;
            let texto = `*INFORME DE TAREAS Y HORARIOS (${fecha})*\n`;
            texto += `----------------------------------------\n\n`;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
                texto += `📌 *${t.descripcion}*\n   🕒 Horario: ${t.inicio} a ${t.fin} | ⏱️ Duración: ${durStr}\n\n`;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            texto += `----------------------------------------\n`;
            texto += `⌛ *TOTAL DEDICADO:* ${totalHrs}h ${totalMins}m\n\n`;
            texto += `_(El PDF detallado se ha generado en las descargas de tu dispositivo para poder adjuntarlo si lo deseas)_`;

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
