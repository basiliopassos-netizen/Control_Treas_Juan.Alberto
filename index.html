<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas — J.A.</title>
    <!-- Librería para generación de PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --accent: #0071e3;
            --accent-light: #e8f2ff;
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --danger: #ff3b30;
            --success: #34c759;
            --border: #e5e5ea;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px 16px;
            padding-bottom: 60px;
        }

        /* Cabecera Estilo iOS */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .btn-menu {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            font-size: 1.2rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        .btn-menu:active {
            transform: scale(0.95);
            background: #e5e5ea;
        }

        /* Menú Desplegable Corregido con Scroll */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 99;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: -300px;
            width: 290px;
            height: 100vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            border-left: 1px solid var(--border);
            overflow-y: auto; /* Permite scroll si la pantalla es corta */
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
        }

        .drawer.open {
            right: 0;
        }

        .drawer h3 {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        /* Tarjetas Estilo Apple */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .form-vertical {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f2f2f7;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .input-row:focus-within {
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .input-icon {
            font-size: 1.1rem;
            opacity: 0.7;
        }

        input {
            width: 100%;
            border: none;
            background: transparent;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }

        .btn-mic {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px;
            transition: transform 0.2s;
        }

        .btn-mic.listening {
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Botones Pulidos iOS */
        .btn-v {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .btn-v:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-primary { background: var(--accent); color: #ffffff; }
        .btn-whatsapp { background: var(--success); color: #ffffff; }
        .btn-pdf { background: #5856d6; color: #ffffff; }
        .btn-danger { background: rgba(255, 59, 48, 0.1); color: var(--danger); border: 1px solid rgba(255, 59, 48, 0.2); }

        /* Lista de Tareas */
        .task-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .task-card:last-child {
            border-bottom: none;
        }

        .task-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .task-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-del {
            background: none;
            border: none;
            color: #c7c7cc;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px;
            transition: color 0.2s;
        }

        .btn-del:hover {
            color: var(--danger);
        }

        .total-box {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--accent);
            font-size: 0.95rem;
        }

        /* Plantilla Oculta para PDF */
        #pdf-template {
            display: none;
            font-family: Arial, sans-serif;
            color: #000;
            padding: 24px;
            background: #fff;
        }

        #pdf-template .header {
            border-bottom: 2px solid #0071e3;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        #pdf-template table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        #pdf-template th, #pdf-template td {
            border-bottom: 1px solid #e5e5ea;
            padding: 10px 8px;
            text-align: left;
            font-size: 12px;
        }

        #pdf-template th { background: #f2f2f7; }
    </style>
</head>
<body>

    <!-- Cabecera -->
    <header>
        <h1>📋 Tareas <span class="badge">J.A.</span></h1>
        <button class="btn-menu" onclick="toggleDrawer()">☰</button>
    </header>

    <!-- Menú Desplegable Lateral con Scroll Accesible -->
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div>
            <h3>Opciones e Informes</h3>
            <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 16px;">Generación de reportes y gestión</p>
        </div>
        
        <button class="btn-v btn-whatsapp" onclick="sendWhatsApp(); toggleDrawer();">📲 Compartir por WhatsApp</button>
        <button class="btn-v btn-pdf" onclick="generatePDF(); toggleDrawer();">📄 Exportar en PDF</button>
        
        <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px;">
            <button class="btn-v btn-danger" onclick="resetTasks(); toggleDrawer();">🗑️ Borrar Todo</button>
        </div>
    </div>

    <!-- Formulario Vertical Estricto con Iconografía -->
    <div class="card">
        <form class="form-vertical" onsubmit="event.preventDefault(); addTask();">
            
            <!-- Fecha -->
            <div>
                <span class="field-label">Fecha</span>
                <div class="input-row">
                    <span class="input-icon">📅</span>
                    <input type="date" id="taskDate">
                </div>
            </div>

            <!-- Tarea + Micrófono -->
            <div>
                <span class="field-label">Acción o Tarea</span>
                <div class="input-row">
                    <span class="input-icon">📝</span>
                    <input type="text" id="taskName" placeholder="Descripción de la tarea...">
                    <button type="button" class="btn-mic" id="micBtn" onclick="startVoiceRecognition()" title="Dictar por voz">🎤</button>
                </div>
            </div>

            <!-- Hora Desde -->
            <div>
                <span class="field-label">Hora Inicio (Desde)</span>
                <div class="input-row">
                    <span class="input-icon">⏱️</span>
                    <input type="time" id="startTime">
                </div>
            </div>

            <!-- Hora Hasta -->
            <div>
                <span class="field-label">Hora Fin (Hasta)</span>
                <div class="input-row">
                    <span class="input-icon">🏁</span>
                    <input type="time" id="endTime">
                </div>
            </div>

            <button type="submit" class="btn-v btn-primary" style="margin-top: 6px;">➕ Guardar Registro</button>
        </form>
    </div>

    <!-- Historial de Tareas -->
    <div class="card">
        <span class="field-label" style="margin-bottom: 10px;">Historial de Tareas</span>
        <div id="taskList"></div>
        <div class="total-box">
            <span>⏱️ Tiempo Total:</span>
            <span id="totalTime">0 min</span>
        </div>
    </div>

    <!-- Contenedor Oculto PDF -->
    <div id="pdf-template">
        <div class="header">
            <div>
                <h2 style="color: #0071e3; margin:0;">INFORME DE CONTROL DE TAREAS</h2>
                <div style="font-size: 12px; color: #86868b; margin-top: 4px;">Responsable: J.A.</div>
            </div>
            <div style="text-align: right; font-size: 12px;" id="pdf-date"></div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tarea / Acción</th>
                    <th>Horario</th>
                    <th>Duración</th>
                </tr>
            </thead>
            <tbody id="pdf-table-body"></tbody>
        </table>
        <div style="margin-top: 20px; text-align: right; font-weight: bold; font-size: 13px; color: #0071e3;" id="pdf-total-time"></div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('dailyTasksJA')) || [];

        document.getElementById('taskDate').valueAsDate = new Date();

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function calculateMinutes(start, end) {
            const [sh, sm] = start.split(':').map(Number);
            const [eh, em] = end.split(':').map(Number);
            let st = sh * 60 + sm;
            let et = eh * 60 + em;
            if (et < st) et += 24 * 60;
            return et - st;
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            let total = 0;

            if (tasks.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color: var(--text-sub); font-size: 0.85rem; padding: 12px 0;">No hay tareas registradas.</p>';
            }

            tasks.sort((a, b) => new Date(a.date + 'T' + a.start) - new Date(b.date + 'T' + b.start));

            tasks.forEach((task, index) => {
                const dur = calculateMinutes(task.start, task.end);
                total += dur;
                const fDate = new Date(task.date + 'T00:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });

                listEl.innerHTML += `
                    <div class="task-card">
                        <div class="task-meta">
                            <span class="task-title">${task.name}</span>
                            <span class="task-sub">
                                <span>📅 ${fDate}</span> | 
                                <span>⏱️ ${task.start} - ${task.end}</span> 
                                <strong>(${dur}m)</strong>
                            </span>
                        </div>
                        <button class="btn-del" onclick="deleteTask(${index})">🗑️</button>
                    </div>
                `;
            });

            document.getElementById('totalTime').innerText = `${total} min (${(total/60).toFixed(1)} h)`;
            localStorage.setItem('dailyTasksJA', JSON.stringify(tasks));
        }

        function addTask() {
            const date = document.getElementById('taskDate').value;
            const name = document.getElementById('taskName').value.trim();
            const start = document.getElementById('startTime').value;
            const end = document.getElementById('endTime').value;

            if (!date || !name || !start || !end) {
                alert('Por favor completa todos los campos.');
                return;
            }

            tasks.push({ date, name, start, end });
            document.getElementById('taskName').value = '';
            document.getElementById('startTime').value = '';
            document.getElementById('endTime').value = '';
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function resetTasks() {
            if (tasks.length === 0) return;
            if (confirm('⚠️ ¿Deseas borrar definitivamente todo el registro de tareas?')) {
                tasks = [];
                renderTasks();
            }
        }

        function generateTextReport() {
            let r = `📊 *CONTROL DE TAREAS — J.A.*\n-----------------------------------\n`;
            let total = 0;
            tasks.forEach((t, i) => {
                const dur = calculateMinutes(t.start, t.end);
                total += dur;
                const fDate = new Date(t.date + 'T00:00:00').toLocaleDateString('es-ES');
                r += `${i + 1}. [${fDate}] ${t.name}\n   ⏰ ${t.start} - ${t.end} (*${dur} min*)\n`;
            });
            r += `-----------------------------------\n⏱️ *Tiempo Total:* ${total} min (${(total/60).toFixed(1)} h)`;
            return r;
        }

        function sendWhatsApp() {
            if (tasks.length === 0) return alert('No hay registros.');
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(generateTextReport())}`, '_blank');
        }

        function generatePDF() {
            if (tasks.length === 0) return alert('No hay registros.');

            const tbody = document.getElementById('pdf-table-body');
            tbody.innerHTML = '';
            let total = 0;

            tasks.forEach(t => {
                const dur = calculateMinutes(t.start, t.end);
                total += dur;
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(t.date + 'T00:00:00').toLocaleDateString('es-ES')}</td>
                        <td><strong>${t.name}</strong></td>
                        <td>${t.start} - ${t.end}</td>
                        <td>${dur} min</td>
                    </tr>
                `;
            });

            document.getElementById('pdf-date').innerText = `Emisión: ${new Date().toLocaleDateString('es-ES')}`;
            document.getElementById('pdf-total-time').innerText = `Tiempo Total Acumulado: ${total} min (${(total/60).toFixed(1)} h)`;

            const element = document.getElementById('pdf-template');
            element.style.display = 'block';

            html2pdf().set({
                margin: 10,
                filename: `Informe_Tareas_JA_${new Date().toISOString().split('T')[0]}.pdf`,
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                element.style.display = 'none';
            });
        }

        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert('Navegador no compatible con dictado.');

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            const micBtn = document.getElementById('micBtn');

            recognition.onstart = () => micBtn.classList.add('listening');
            recognition.onresult = (e) => {
                document.getElementById('taskName').value = e.results[0][0].transcript;
                micBtn.classList.remove('listening');
            };
            recognition.onerror = recognition.onend = () => micBtn.classList.remove('listening');
            recognition.start();
        }

        renderTasks();
    </script>
</body>
</html>
