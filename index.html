<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Tareas</title>

    <!-- Librería externa para la exportación de archivos PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #0d47a1;
            --bg: #e0e5ec;
            --text: #2d3748;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Estilo 3D Neumórfico para tarjetas */
        .card-3d {
            background: var(--bg);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 8px 8px 16px var(--shadow-dark), 
                        -8px -8px 16px var(--shadow-light);
        }

        label {
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-top: 5px;
            color: #4a5568;
            text-transform: uppercase;
        }

        input[type="date"], input[type="text"], input[type="time"] {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: var(--bg);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            box-sizing: border-box;
            text-align: center;
        }

        .time-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        /* Botones táctiles interactivos */
        .btn-3d {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: var(--primary);
            box-shadow: 5px 5px 10px var(--shadow-dark), 
                        -5px -5px 10px var(--shadow-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-3d:active {
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
        }

        .btn-mic { background: #c62828; }
        .btn-pdf { background: #2e7d32; }
        .btn-ws  { background: #25d366; }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #cbd5e0;
            font-size: 14px;
        }

        .total-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>📋 Control de Tareas</h1>

    <!-- Selección de Fecha -->
    <div class="card-3d">
        <label for="fecha">Fecha de Registro</label>
        <input type="date" id="fecha">
    </div>

    <!-- Entrada por Texto o Voz -->
    <div class="card-3d">
        <label for="tarea">Descripción de la Tarea</label>
        <input type="text" id="tarea" placeholder="Escribe o dicta la tarea...">
        <button type="button" class="btn-3d btn-mic" onclick="dictarVoz()">
            🎤 Dictar por Voz
        </button>
    </div>

    <!-- Selección de Horas (Relojes) -->
    <div class="card-3d">
        <label>Control Horario</label>
        <div class="time-container">
            <div>
                <label style="font-size: 10px;">Inicio</label>
                <input type="time" id="h-inicio" value="08:00">
            </div>
            <div>
                <label style="font-size: 10px;">Fin</label>
                <input type="time" id="h-fin" value="09:00">
            </div>
        </div>
        <button type="button" class="btn-3d" onclick="agregarTarea()">
            ➕ Añadir Tarea
        </button>
    </div>

    <!-- Lista de Tareas y Totales -->
    <div class="card-3d">
        <label>Tareas Registradas</label>
        <div id="lista-tareas"></div>
        <div class="total-box" id="sumatorio-total">Total: 0h 0m</div>
    </div>

    <!-- Acciones -->
    <button type="button" class="btn-3d btn-pdf" onclick="generarPDF()">
        📄 Generar PDF
    </button>
    <button type="button" class="btn-3d btn-ws" onclick="enviarWhatsApp()">
        💬 Compartir por WhatsApp
    </button>

    <script>
        let tareas = [];

        window.onload = () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').value = hoy;
        };

        function dictarVoz() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("El navegador de tu Android no soporta reconocimiento de voz directo.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                document.getElementById('tarea').value = texto.toUpperCase();
            };
        }

        function agregarTarea() {
            const desc = document.getElementById('tarea').value.trim();
            const hIni = document.getElementById('h-inicio').value;
            const hFin = document.getElementById('h-fin').value;

            if (!desc) {
                alert("Escribe o dicta una tarea primero.");
                return;
            }

            const [h1, m1] = hIni.split(':').map(Number);
            const [h2, m2] = hFin.split(':').map(Number);
            let minInicio = h1 * 60 + m1;
            let minFin = h2 * 60 + m2;

            if (minFin <= minInicio) {
                alert("La hora de fin debe ser posterior a la de inicio.");
                return;
            }

            const duracionMin = minFin - minInicio;

            tareas.push({
                descripcion: desc.toUpperCase(),
                inicio: hIni,
                fin: hFin,
                minutos: duracionMin
            });

            document.getElementById('tarea').value = '';
            actualizarLista();
        }

        function actualizarLista() {
            const contenedor = document.getElementById('lista-tareas');
            contenedor.innerHTML = '';
            let totalMinutos = 0;

            tareas.forEach((t, index) => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const tiempoTexto = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                contenedor.innerHTML += `
                    <div class="task-item">
                        <div>
                            <strong>${t.descripcion}</strong><br>
                            <small>${t.inicio} - ${t.fin}</small>
                        </div>
                        <div>
                            <span style="font-weight:bold; color:var(--primary);">${tiempoTexto}</span>
                            <button onclick="eliminarTarea(${index})" style="border:none; background:none; color:red; margin-left:8px;">❌</button>
                        </div>
                    </div>
                `;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            document.getElementById('sumatorio-total').innerText = `Total Horas: ${totalHrs}h ${totalMins}m`;
        }

        function eliminarTarea(index) {
            tareas.splice(index, 1);
            actualizarLista();
        }

        function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const fecha = document.getElementById('fecha').value;

            doc.setFontSize(16);
            doc.text("INFORME DE TAREAS Y HORARIOS", 20, 20);
            doc.setFontSize(11);
            doc.text(`Fecha: ${fecha}`, 20, 28);

            let y = 40;
            doc.text("Tarea", 20, y);
            doc.text("Horario", 120, y);
            doc.text("Duración", 160, y);
            doc.line(20, y + 2, 190, y + 2);

            y += 10;
            let totalMinutos = 0;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                doc.text(t.descripcion.substring(0, 30), 20, y);
                doc.text(`${t.inicio} - ${t.fin}`, 120, y);
                doc.text(durStr, 160, y);
                y += 8;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            doc.line(20, y + 2, 190, y + 2);
            y += 10;
            doc.setFontSize(13);
            doc.text(`SUMATORIO TOTAL: ${totalHrs}h ${totalMins}m`, 20, y);

            doc.save(`Registro_${fecha}.pdf`);
        }

        function enviarWhatsApp() {
            const fecha = document.getElementById('fecha').value;
            let totalMinutos = 0;
            let texto = `*REGISTRO DE TAREAS (${fecha})*\n\n`;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
                texto += `• *${t.descripcion}*\n  ⏱️ ${t.inicio} a ${t.fin} (${durStr})\n`;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            texto += `\n*TOTAL:* ${totalHrs}h ${totalMins}m`;

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
