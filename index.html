<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Tareas J.A.</title>

    <!-- Librería externa para la generación del documento PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --primary: #0d47a1;
            --bg: #e0e5ec;
            --text: #2d3748;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            color: var(--primary);
            text-transform: uppercase;
            margin: 5px 0 15px 0;
        }

        .card-3d {
            background: var(--bg);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                        -6px -6px 12px var(--shadow-light);
        }

        label {
            font-weight: bold;
            font-size: 12px;
            display: block;
            margin-top: 2px;
            color: #4a5568;
            text-transform: uppercase;
        }

        input[type="date"], input[type="text"], input[type="time"] {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light);
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            box-sizing: border-box;
            text-align: center;
        }

        /* Campo de texto con micrófono */
        .input-mic-container {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }

        .input-mic-container input {
            flex: 1;
            margin-top: 0;
            text-align: left;
            padding-left: 14px;
        }

        .btn-mic-small {
            background: #c62828;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), 
                        -3px -3px 6px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic-small:active {
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
        }

        .time-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-3d {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: var(--primary);
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-sizing: border-box;
        }

        .btn-3d:active {
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.3);
        }

        .btn-pdf { background: #2e7d32; }
        .btn-ws  { background: #25d366; }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #cbd5e0;
            font-size: 14px;
        }

        .total-box {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 10px;
        }

        .actions-footer {
            margin-top: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- TÍTULO PRINCIPAL -->
    <h1>📋 Control de Tareas J.A.</h1>

    <!-- 1. Fecha de Registro -->
    <div class="card-3d">
        <label for="fecha">Fecha de Registro</label>
        <input type="date" id="fecha">
    </div>

    <!-- 2. Descripción de Tarea + Micrófono -->
    <div class="card-3d">
        <label for="tarea">Descripción de la Tarea</label>
        <div class="input-mic-container">
            <input type="text" id="tarea" placeholder="Escribe o pulsa el micro...">
            <button type="button" class="btn-mic-small" onclick="dictarTexto()" title="Dictar por voz">
                🎤
            </button>
        </div>
    </div>

    <!-- 3. Horario y Botón para Grabar -->
    <div class="card-3d">
        <label>Horario de la Tarea</label>
        <div class="time-container">
            <div>
                <label style="font-size: 10px;">Inicio</label>
                <input type="time" id="h-inicio" value="08:00">
            </div>
            <div>
                <label style="font-size: 10px;">Fin</label>
                <input type="time" id="h-fin" value="09:00">
            </div>
        </div>

        <button type="button" class="btn-3d" onclick="grabarTarea()">
            💾 Grabar Tarea
        </button>
    </div>

    <!-- 4. Tareas Registradas -->
    <div class="card-3d">
        <label>Tareas Registradas</label>
        <div id="lista-tareas"></div>
        <div class="total-box" id="sumatorio-total">Total: 0h 0m</div>
    </div>

    <!-- 5. Acciones Principales -->
    <div class="actions-footer">
        <button type="button" class="btn-3d btn-pdf" onclick="generarPDF()">
            📄 Generar PDF
        </button>
        <button type="button" class="btn-3d btn-ws" onclick="enviarWhatsApp()">
            💬 Enviar WS
        </button>
    </div>

    <script>
        let tareas = [];

        window.onload = () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fecha').value = hoy;
        };

        // Formateador de fecha al estándar europeo DD/MM/AAAA
        function obtenerFechaEuropea(fechaISO) {
            if (!fechaISO) return "";
            const partes = fechaISO.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function dictarTexto() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Tu navegador no soporta el reconocimiento de voz nativo.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.start();

            recognition.onresult = (event) => {
                const texto = event.results[0][0].transcript;
                document.getElementById('tarea').value = texto.toUpperCase();
            };
        }

        function grabarTarea() {
            const desc = document.getElementById('tarea').value.trim();
            if (!desc) {
                alert("Por favor, escribe o dicta una descripción para la tarea.");
                return;
            }

            const hIni = document.getElementById('h-inicio').value;
            const hFin = document.getElementById('h-fin').value;

            const [h1, m1] = hIni.split(':').map(Number);
            const [h2, m2] = hFin.split(':').map(Number);
            let minInicio = h1 * 60 + m1;
            let minFin = h2 * 60 + m2;

            if (minFin <= minInicio) {
                minFin += 1440; // Ajuste para turnos que pasan de medianoche
            }

            const duracionMin = minFin - minInicio;

            tareas.push({
                descripcion: desc.toUpperCase(),
                inicio: hIni,
                fin: hFin,
                minutos: duracionMin
            });

            // Limpieza del campo de texto
            document.getElementById('tarea').value = '';

            actualizarLista();
        }

        function actualizarLista() {
            const contenedor = document.getElementById('lista-tareas');
            contenedor.innerHTML = '';
            let totalMinutos = 0;

            tareas.forEach((t, index) => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const tiempoTexto = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                contenedor.innerHTML += `
                    <div class="task-item">
                        <div style="flex: 1; padding-right: 5px;">
                            <strong>${t.descripcion}</strong><br>
                            <small style="color:#718096;">${t.inicio} - ${t.fin}</small>
                        </div>
                        <div style="text-align: right; min-width: 70px;">
                            <span style="font-weight:bold; color:var(--primary);">${tiempoTexto}</span>
                            <button onclick="eliminarTarea(${index})" style="border:none; background:none; color:red; margin-left:4px; cursor:pointer;">❌</button>
                        </div>
                    </div>
                `;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            document.getElementById('sumatorio-total').innerText = `Total Horas: ${totalHrs}h ${totalMins}m`;
        }

        function eliminarTarea(index) {
            tareas.splice(index, 1);
            actualizarLista();
        }

        // Generación de PDF con cabecera corporativa y tabla limpia
        function generarPDF() {
            if (tareas.length === 0) {
                alert("No hay tareas registradas para generar el informe.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const fechaISO = document.getElementById('fecha').value;
            const fechaEuropea = obtenerFechaEuropea(fechaISO);

            // --- CABECERA ESTILIZADA (BANNER AZUL) ---
            doc.setFillColor(13, 71, 161); // Azul oscuro
            doc.rect(0, 0, 210, 38, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.text("INFORME DE CONTROL DE TAREAS", 15, 18);

            doc.setFontSize(11);
            doc.setFont(undefined, 'normal');
            doc.text(`Operador / Registro: Juan Alberto (J.A.)`, 15, 27);
            doc.text(`Fecha: ${fechaEuropea}`, 150, 27);

            // --- TABLA DE TAREAS ---
            let y = 50;
            doc.setTextColor(45, 55, 72);
            doc.setFont(undefined, 'bold');
            doc.text("Descripción de Tarea", 15, y);
            doc.text("Horario", 130, y);
            doc.text("Duración", 165, y);
            doc.setDrawColor(200, 200, 200);
            doc.line(15, y + 2, 195, y + 2);

            y += 10;
            doc.setFont(undefined, 'normal');
            let totalMinutos = 0;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;

                // División de texto para evitar que se corte (ancho ampliado a 110 mm)
                const lineasTexto = doc.splitTextToSize(t.descripcion, 110);
                doc.text(lineasTexto, 15, y);
                doc.text(`${t.inicio} - ${t.fin}`, 130, y);
                doc.text(durStr, 165, y);

                const altoTexto = lineasTexto.length * 6;
                y += altoTexto + 4;
            });

            // --- SUMATORIO TOTAL ---
            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            doc.line(15, y + 2, 195, y + 2);
            y += 10;
            doc.setFont(undefined, 'bold');
            doc.setFontSize(12);
            doc.text(`SUMATORIO TOTAL DEDICADO: ${totalHrs}h ${totalMins}m`, 15, y);

            doc.save(`Registro_Tareas_${fechaEuropea.replace(/\//g, '-')}.pdf`);
        }

        function enviarWhatsApp() {
            if (tareas.length === 0) {
                alert("Agrega al menos una tarea antes de compartir.");
                return;
            }

            generarPDF();

            const fechaEuropea = obtenerFechaEuropea(document.getElementById('fecha').value);
            let totalMinutos = 0;
            let texto = `*INFORME DE TAREAS Y HORARIOS - J.A. (${fechaEuropea})*\n\n`;

            tareas.forEach(t => {
                totalMinutos += t.minutos;
                const hrs = Math.floor(t.minutos / 60);
                const mins = t.minutos % 60;
                const durStr = `${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
                texto += `📌 *${t.descripcion}*\n   🕒 Horario: ${t.inicio} a ${t.fin} (${durStr})\n\n`;
            });

            const totalHrs = Math.floor(totalMinutos / 60);
            const totalMins = totalMinutos % 60;
            texto += `⌛ *TOTAL DEDICADO:* ${totalHrs}h ${totalMins}m\n\n`;
            texto += `_(PDF descargado en el dispositivo listo para adjuntar)_`;

            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
